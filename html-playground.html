<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HTML Playground</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            padding: 10px;
            background-color: #ddd;
            overflow: hidden;
        }


        .editor {
            position: relative;
            width: 50%;
            height: 100%;
            min-width: 0;
        }

        textarea {
            display: block;

            width: 100%;
            height: 100%;

            padding: 15px;

            font-size: 16px;
            font-family: monospace;

            border: 1px solid #ccc;
            border-radius: 5px;

            outline: none;
            resize: none;

            white-space: pre;
            overflow: auto;
        }


        iframe {
            display: block;

            width: 50%;
            height: 100%;

            min-width: 0;

            background-color: #fff;

            border: 1px solid #ccc;
            border-radius: 5px;
        }


        #autocomplete {
            position: absolute;

            display: none;

            min-width: 180px;
            max-width: 300px;

            max-height: 224px;

            overflow-y: auto;
            overflow-x: hidden;

            background: #ddd;
            color: #000;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-family: monospace;
            font-size: 14px;

            z-index: 1000;
        }

        .suggestion {
            height: 32px;

            padding: 0 12px;

            display: flex;
            align-items: center;

            cursor: pointer;

            white-space: nowrap;
        }

        .suggestion.active {
            background: #0078d4;
            color: white;
        }

        .suggestion:hover {
            background: #ccc;
        }

        .suggestion.active:hover {
            background: #0078d4;
        }


        #mirror {
            position: absolute;

            visibility: hidden;

            top: 0;
            left: 0;

            pointer-events: none;

            white-space: pre;
            word-wrap: normal;
            overflow-wrap: normal;
        }


        @media (max-width: 900px) {

            textarea {
                padding: 12px;
                font-size: 15px;
            }

            #autocomplete {
                max-width: 260px;
            }
        }



        @media (max-width: 700px) {

            html,
            body {
                height: auto;
                min-height: 100%;
            }

            body {
                display: flex;
                flex-direction: column;

                gap: 8px;
                padding: 8px;

                overflow: auto;
            }


            .editor {
                width: 100%;
                height: 55vh;
                min-height: 350px;
                flex-shrink: 0;
            }


            iframe {
                width: 100%;
                height: 45vh;
                min-height: 300px;
                flex-shrink: 0;
            }

            textarea {
                padding: 12px;

                font-size: 16px;
                line-height: 1.5;

                border-radius: 5px;
            }

            #autocomplete {
                min-width: 160px;
                max-width: calc(100vw - 20px);

                max-height: 192px;

                font-size: 14px;
            }

            .suggestion {
                height: 32px;
                padding: 0 10px;
            }
        }



        @media (max-width: 400px) {

            body {
                padding: 5px;
                gap: 5px;
            }

            .editor {
                height: 60vh;
                min-height: 300px;
            }

            iframe {
                height: 40vh;
                min-height: 250px;
            }

            #autocomplete {
                max-width: calc(100vw - 10px);
            }
        }
    </style>
</head>

function updatePreview() {
    iframe.srcdoc = textarea.value;
}



function getCursorPosition() {

    const style =
        window.getComputedStyle(textarea);

    mirror.style.width =
        textarea.clientWidth + "px";

    mirror.style.fontFamily =
        style.fontFamily;

    mirror.style.fontSize =
        style.fontSize;

    mirror.style.fontWeight =
        style.fontWeight;

    mirror.style.lineHeight =
        style.lineHeight;

    mirror.style.letterSpacing =
        style.letterSpacing;

    mirror.style.padding =
        style.padding;

    mirror.style.border =
        style.border;

    mirror.scrollTop = textarea.scrollTop;

    const cursor =
        textarea.selectionStart;

    const text =
        textarea.value.substring(0, cursor);

    mirror.textContent = text;

    const span =
        document.createElement("span");

    span.textContent = "|";

    mirror.appendChild(span);

    const rect =
        span.getBoundingClientRect();

    const mirrorRect =
        mirror.getBoundingClientRect();

    return {
        left:
            rect.left -
            mirrorRect.left -
            textarea.scrollLeft,

        top:
            rect.top -
            mirrorRect.top -
            textarea.scrollTop
    };
}



function positionAutocomplete() {

    const cursor =
        getCursorPosition();

    const style =
        window.getComputedStyle(textarea);

    const lineHeight =
        parseFloat(style.lineHeight) || 24;

    let left =
        cursor.left + 15;

    let top =
        cursor.top + lineHeight + 15;

    const maxLeft =
        textarea.clientWidth -
        autocomplete.offsetWidth -
        8;

    if (left > maxLeft) {
        left = Math.max(5, maxLeft);
    }


    const maxTop =
        textarea.clientHeight -
        autocomplete.offsetHeight -
        8;

    if (top > maxTop) {

        top =
            cursor.top -
            autocomplete.offsetHeight +
            10;
    }

    autocomplete.style.left =
        left + "px";

    autocomplete.style.top =
        top + "px";
}



function getCurrentTag() {

    const cursor =
        textarea.selectionStart;

    const before =
        textarea.value.substring(0, cursor);


    const match =
        before.match(/<([a-zA-Z][a-zA-Z0-9-]*)\s+[^<>]*$/);

    if (match) {
        return match[1].toLowerCase();
    }


    const simpleMatch =
        before.match(/<([a-zA-Z][a-zA-Z0-9-]*)[^<>]*$/);

    if (simpleMatch) {
        return simpleMatch[1].toLowerCase();
    }

    return null;
}



function getAttributeContext() {

    const cursor = textarea.selectionStart;

    const before =
        textarea.value.substring(0, cursor);

    const tagStart =
        before.lastIndexOf("<");

    if (tagStart === -1) {
        return null;
    }

    const tagContent =
        before.substring(tagStart + 1);

    if (tagContent.includes(">")) {
        return null;
    }

    if (tagContent.startsWith("/")) {
        return null;
    }

    const tagMatch =
        tagContent.match(
            /^([a-zA-Z][a-zA-Z0-9-]*)/
        );

    if (!tagMatch) {
        return null;
    }

    const tagName =
        tagMatch[1].toLowerCase();

    const afterTag =
        tagContent.substring(
            tagMatch[0].length
        );

    if (!/\s/.test(afterTag)) {
        return null;
    }


    let insideDoubleQuote = false;
    let insideSingleQuote = false;

    for (const char of afterTag) {

        if (
            char === '"' &&
            !insideSingleQuote
        ) {
            insideDoubleQuote =
                !insideDoubleQuote;
        }

        if (
            char === "'" &&
            !insideDoubleQuote
        ) {
            insideSingleQuote =
                !insideSingleQuote;
        }
    }

    if (
        insideDoubleQuote ||
        insideSingleQuote
    ) {
        return null;
    }


    const partialMatch =
        afterTag.match(
            /(?:^|\s)([a-zA-Z_:][a-zA-Z0-9_:-]*)$/
        );

    const partialAttribute =
        partialMatch
            ? partialMatch[1]
            : "";


    return {
        tagName,
        partialAttribute
    };
}


function getAttributesForTag(tagName) {

    const specific =
        attributes[tagName] || [];

    return [
        ...specific,
        ...globalAttributes
    ];
}



function getTagSuggestions() {

    const cursor =
        textarea.selectionStart;

    const before =
        textarea.value.substring(0, cursor);


    const match =
        before.match(/<([a-zA-Z0-9-]*)$/);

    if (!match) {
        return null;
    }

    const query =
        match[1].toLowerCase();

    const results =
        htmlElements
            .filter(tag =>
                tag.startsWith(query)
            )
            .map(tag => `<${tag}>`);

    return {
        results,
        query
    };
}



function getAttributeSuggestions() {

    const context =
        getAttributeContext();

    if (!context) {
        return null;
    }

    const {
        tagName,
        partialAttribute
    } = context;

    const query =
        partialAttribute.toLowerCase();

    const available =
        getAttributesForTag(tagName);

    const results =
        available
            .filter(attribute =>
                attribute.toLowerCase().startsWith(query)
            )
            .filter(
                (attribute, index, array) =>
                    array.indexOf(attribute) === index
            );

    return {
        results,
        tagName,
        query
    };
}



function showAutocomplete() {


    const attributeData =
        getAttributeSuggestions();

    if (
        attributeData &&
        attributeData.results.length > 0
    ) {

        currentMode = "attribute";

        currentResults =
            attributeData.results;

        updateSuggestions();

        return;
    }



    const tagData =
        getTagSuggestions();

    if (
        tagData &&
        tagData.results.length > 0
    ) {

        currentMode = "tag";

        currentResults =
            tagData.results;

        updateSuggestions();

        return;
    }


    hideAutocomplete();
}



function updateSuggestions() {


    if (!autocomplete.dataset.mode ||
        autocomplete.dataset.mode !== currentMode) {

        selectedIndex = 0;

    }

    autocomplete.dataset.mode =
        currentMode;


    if (
        selectedIndex >= currentResults.length
    ) {
        selectedIndex = 0;
    }

    renderSuggestions();

    autocomplete.style.display =
        "block";

    positionAutocomplete();
}



function renderSuggestions() {

    autocomplete.innerHTML = "";


    currentResults.forEach(
        (suggestion, index) => {

            const item =
                document.createElement("div");

            item.className =
                "suggestion";

            if (
                index === selectedIndex
            ) {
                item.classList.add("active");
            }

            item.textContent =
                currentMode === "attribute"
                    ? suggestion
                    : suggestion;

            item.addEventListener(
                "mousedown",
                event => {

                    event.preventDefault();

                    selectSuggestion(
                        suggestion
                    );
                }
            );

            autocomplete.appendChild(item);
        }
    );

    scrollToSelected();
}



function scrollToSelected() {

    const items =
        autocomplete.querySelectorAll(
            ".suggestion"
        );

    if (!items[selectedIndex]) {
        return;
    }

    items[selectedIndex].scrollIntoView({
        block: "nearest"
    });
}



function selectTag(tag) {

    const cursor =
        textarea.selectionStart;

    const before =
        textarea.value.substring(0, cursor);

    const match =
        before.match(/<([a-zA-Z0-9-]*)$/);

    if (!match) {
        return;
    }

    const start =
        cursor - match[0].length;

    const tagName =
        tag
            .replace("<", "")
            .replace(">", "")
            .toLowerCase();



    if (tagTemplates[tagName]) {

        const template =
            tagTemplates[tagName];

        const insertion =
            template.text;

        textarea.value =
            textarea.value.substring(0, start) +
            insertion +
            textarea.value.substring(cursor);

        const newCursor =
            start + template.cursor;

        textarea.selectionStart =
            newCursor;

        textarea.selectionEnd =
            newCursor;

    } else {


        let insertion;
        let newCursor;

        if (voidElements.has(tagName)) {

            insertion =
                `<${tagName}>`;

            newCursor =
                start +
                insertion.length;

        } else {

            insertion =
                `<${tagName}></${tagName}>`;

            newCursor =
                start +
                tagName.length +
                2;
        }

        textarea.value =
            textarea.value.substring(0, start) +
            insertion +
            textarea.value.substring(cursor);

        textarea.selectionStart =
            newCursor;

        textarea.selectionEnd =
            newCursor;
    }

    hideAutocomplete();

    updatePreview();

    textarea.focus();
}



function selectAttribute(attribute) {

    const cursor =
        textarea.selectionStart;

    const before =
        textarea.value.substring(0, cursor);


    const match =
        before.match(
            /([a-zA-Z_:][a-zA-Z0-9_:-]*)$/

    if (!match) {
        return;
    }

    const start =
        cursor - match[0].length;



    const booleanAttributes = new Set([
        "autofocus",

        "checked",
        "controls",
        "default",
        "defer",
        "disabled",
        "hidden",

        "loop",
        "multiple",
        "muted",
        "nomodule",
        "novalidate",
        "open",
        "playsinline",
        "readonly",
        "required",
        "reversed"
    ]);



    const needsValue =
        !booleanAttributes.has(attribute);


    let insertion;
    let newCursor;


    if (needsValue) {

        insertion =
            `${attribute}=""`;


        newCursor =
            start +
            attribute.length +
            2;

    } else {

        insertion =
            attribute;

        newCursor =
            start +
            attribute.length;
    }


    textarea.value =
        textarea.value.substring(0, start) +
        insertion +
        textarea.value.substring(cursor);

    textarea.selectionStart =
        newCursor;

    textarea.selectionEnd =
        newCursor;


    hideAutocomplete();

    updatePreview();

    textarea.focus();
}



function selectSuggestion(suggestion) {

    if (currentMode === "tag") {

        selectTag(suggestion);

    } else if (currentMode === "attribute") {

        selectAttribute(suggestion);
    }
}



function hideAutocomplete() {

    autocomplete.style.display =
        "none";

    autocomplete.innerHTML = "";

    currentResults = [];

    currentMode = null;

    autocomplete.dataset.mode = "";
}



textarea.addEventListener("keydown", event => {


    if (event.key === "Tab") {

        if (
            autocomplete.style.display === "block" &&
            currentResults.length > 0
        ) {
            event.preventDefault();

            selectSuggestion(
                currentResults[selectedIndex]
            );

            return;
        }


        event.preventDefault();

        const start =
            textarea.selectionStart;

        const end =
            textarea.selectionEnd;

        textarea.value =
            textarea.value.substring(0, start) +
            "    " +
            textarea.value.substring(end);


        textarea.selectionStart =
            start + 4;

        textarea.selectionEnd =
            start + 4;

        updatePreview();

        return;
    }



    if (
        autocomplete.style.display !== "block" ||
        currentResults.length === 0
    ) {
        return;
    }



    if (event.key === "ArrowDown") {

        event.preventDefault();

        selectedIndex++;

        if (
            selectedIndex >=
            currentResults.length
        ) {
            selectedIndex = 0;
        }

        renderSuggestions();

        return;
    }



    if (event.key === "ArrowUp") {

        event.preventDefault();

        selectedIndex--;

        if (selectedIndex < 0) {
            selectedIndex =
                currentResults.length - 1;
        }

        renderSuggestions();

        return;
    }



    if (event.key === "Enter") {

        event.preventDefault();

        if (
            currentResults[selectedIndex]
        ) {
            selectSuggestion(
                currentResults[selectedIndex]
            );
        }

        return;
    }



    if (event.key === "Escape") {

        event.preventDefault();

        hideAutocomplete();

        return;
    }
});


textarea.addEventListener(
    "input",
    () => {

        updatePreview();


        selectedIndex = 0;

        showAutocomplete();
    }
);



textarea.addEventListener(
    "click",
    () => {

        selectedIndex = 0;

        showAutocomplete();
    }
);



textarea.addEventListener(
    "keyup",
    event => {


        if (
            event.key !== "ArrowUp" &&
            event.key !== "ArrowDown"
        ) {

            showAutocomplete();
        }
    }
);



textarea.addEventListener(
    "scroll",
    () => {

        if (
            autocomplete.style.display ===
            "block"
        ) {

            positionAutocomplete();
        }
    }
);



textarea.addEventListener(
    "focus",
    () => {

        showAutocomplete();
    }
);



updatePreview();

</script>

</body>
</html>
